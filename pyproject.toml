[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-silver-forecasting"
version = "0.1.0"
description = "Reproducible walk-forward machine-learning research for Gold and Silver returns."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Aurelien"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "yfinance>=0.2.40,<1",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "pyarrow>=15,<22",
  "joblib>=1.3,<2",
  "tqdm>=4.66,<5",
  "nbformat>=5.9,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
foundation = [
  "chronos-forecasting==2.3.1",
  "timesfm==2.0.2",
]
research = [
  "xgboost>=2.0,<4",
  "optuna>=3.6,<5",
  "fredapi>=0.5,<1",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "jupyter>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
